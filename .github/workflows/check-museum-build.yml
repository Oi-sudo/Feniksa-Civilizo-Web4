name: Verify staged museum website build
on:
  push:
    branches: [museum-videos-07-10-staging-20261018]
    paths: [.github/workflows/check-museum-build.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: museum-videos-07-10-staging-20261018
      - name: Build existing site without modifying originals
        run: python3 scripts/assemble-originals.py
      - name: Check main portal, nine halls and four embedded videos
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json,hashlib
          root=Path('dist')
          for name in ['index.html','museum/index.html','museum/collection-videos/index.html']:
              p=root/name
              assert p.is_file() and p.stat().st_size>500,name
          page=(root/'museum/collection-videos/index.html').read_text()
          museum=(root/'museum/index.html').read_text()
          assert 'collection-videos/' in museum
          records=json.loads((root/'museum/collection-videos/videos/verified-manifest.json').read_text())
          for num in ['07','08','09','10']:
              p=root/'museum/collection-videos/videos'/f'{num}.mp4'
              assert p.is_file(),str(p)
              assert p.stat().st_size==records[num]['size_bytes']
              assert hashlib.sha256(p.read_bytes()).hexdigest()==records[num]['sha256']
              print('Verified built film',num,round(p.stat().st_size/1e6,2),'MB')
          for n in range(1,10):
              assert (root/'museum/halls'/('01.html' if n==1 else f'{n:02d}')).exists() or any((root/'museum/halls'/f'{n:02d}').glob('*.html')),f'hall {n} missing'
          print('Museum staging build check passed')
          PY
